<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#173f58" />
<title>附近站牌｜MyBUS</title>
<link rel="stylesheet" href="./styles_a.css" />
</head>
<body data-page="nearby">
<main class="app-frame">
<header class="brand-header page-header">
  <a class="back-link" href="./index.html">‹ 回到找公車</a>
  <p class="eyebrow">MyBUS</p>
  <h1>附近站牌</h1>
  <p class="brand-subtitle">依目前位置尋找附近的公車站</p>
</header>

<section id="nearbyPanel" class="content-panel page-panel" aria-labelledby="nearbyTitle">
  <div class="section-heading">
    <div><p class="eyebrow">附近站牌</p><h2 id="nearbyTitle">找我附近的公車站</h2></div>
  </div>
  <p id="locationMessage" class="helper-text">按下按鈕後，瀏覽器才會詢問定位權限。</p>
  <button id="retryLocationBtn" class="primary-button full-button" type="button">取得目前位置</button>
  <div id="nearbyList" class="stack-list"></div>
</section>

<section id="resultPanel" class="result-panel" aria-labelledby="resultTitle">
  <div class="section-heading"><div><p class="eyebrow">即時到站</p><h2 id="resultTitle">到站查詢</h2></div><span id="resultTag" class="tag">尚未選擇</span></div>
  <div id="arrivalList" class="arrival-list"><div class="empty">選擇附近站牌後，這裡會顯示即時到站資訊。</div></div>
</section>

<section class="data-note"><strong>v0.50b</strong><p>定位只會在你按下按鈕後使用，不會保存定位紀錄。資料來自大臺北公車官方資料服務。</p></section>
<footer><a href="./index.html">MyBUS 找公車</a><a href="./favorites.html">我的常用</a></footer>
</main>
<script src="./app.js" defer></script>
</body>
</html>

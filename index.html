<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#173f58" />
<meta name="description" content="MyBUS 我的公車時刻表｜雙北公車即時到站與常用站牌查詢" />
<title>MyBUS 我的公車時刻表</title>
<link rel="stylesheet" href="./styles_a.css" />
</head>
<body>
<main class="app-frame">

<header class="brand-header" style="position:relative;">
<h1>MyBUS 找公車</h1>
<p class="brand-subtitle">查詢公車到站時間</p>
</header>

<section class="home-card" aria-labelledby="homeTitle">
<div class="home-heading">
<p class="eyebrow">今天要去哪裡？</p>
<h2 id="homeTitle">查到站時間</h2>
</div>

<form id="searchForm" class="form-grid" style="margin-bottom:12px;" autocomplete="off">
<label for="searchInput" class="sr-only">搜尋站牌或路線名稱</label>
<input id="searchInput" type="search" placeholder="輸入站牌名稱或路線，例如 南京復興、306" />
<button id="searchBtn" class="primary-button full-button" type="submit">搜尋</button>
</form>
<div class="route-keyboard" aria-label="公車路線分類快速輸入">
<div class="keyboard-heading"><strong>路線分類快速輸入</strong><span>點選後可再補路線號碼</span></div>
<div id="routeCategoryGrid" class="route-category-grid">
<div class="route-category-row row-five">
<button class="route-key route-color blue" type="button" data-route-prefix="藍">藍</button>
<button class="route-key route-color red" type="button" data-route-prefix="紅">紅</button>
<button class="route-key route-color green" type="button" data-route-prefix="綠">綠</button>
<button class="route-key route-color brown" type="button" data-route-prefix="棕">棕</button>
<button class="route-key route-color yellow" type="button" data-route-prefix="橘">橘</button>
</div>
<div class="route-category-row row-four">
<button class="route-key" type="button" data-category="幹線">幹線</button>
<button class="route-key" type="button" data-category="通勤">通勤</button>
<button class="route-key" type="button" data-category="輕軌">輕軌</button>
<button class="route-key" type="button" data-category="先導">先導</button>
</div>
<div class="route-category-row row-four">
<button class="route-key" type="button" data-category="小">小</button>
<button class="route-key" type="button" data-category="市民小巴">市民小巴</button>
<button class="route-key" type="button" data-route-prefix="F">新巴士 F</button>
<button class="route-key" type="button" data-category="跳蛙">跳蛙</button>
</div>
<div class="route-category-row row-other-actions">
<button class="route-key other" type="button" data-category="其他">其他（觀光、花季、懷恩⋯）</button>
<button id="clearRouteFilterBtn" class="route-key clear" type="button">清除</button>
</div>
</div>
<div id="categoryOptions" class="category-options" hidden></div>
</div>
<div id="searchResults" class="stack-list" hidden></div>

<nav class="home-links" aria-label="其他公車功能">
<a href="./nearby.html">附近站牌</a>
<a href="./favorites.html">我的常用</a>
</nav>
</section>

<section id="resultPanel" class="result-panel" aria-labelledby="resultTitle">
<div class="section-heading">
<div><p class="eyebrow">即時到站</p><h2 id="resultTitle">到站查詢</h2></div>
<span id="resultTag" class="tag">尚未選擇</span>
</div>
<div id="arrivalList" class="arrival-list">
<div class="empty">搜尋站牌／路線，或選擇附近站牌、我的常用後，這裡會顯示即時到站資訊。</div>
</div>
</section>

<footer>
<span>MyBUS 我的公車時刻表</span>
<span>v0.50b｜手機直式優先</span>
</footer>
</main>
<script src="./app.js" defer></script>
</body>
</html>
